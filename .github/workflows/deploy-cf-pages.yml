name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CLOUDFLARE_PROJECT_NAME: chinaconnect

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm
      - run: pnpm install --ignore-scripts
      - run: pnpm build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_MINIMAX_API_KEY: ${{ secrets.PUBLIC_MINIMAX_API_KEY }}
          PUBLIC_MINIMAX_BASE_URL: ${{ secrets.PUBLIC_MINIMAX_BASE_URL }}
          VITE_ANYSEARCH_API_KEY: ${{ secrets.VITE_ANYSEARCH_API_KEY }}
      - run: cp -r functions dist/functions
      - run: npm install -g wrangler@latest
      - name: Set Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
        run: |
          echo "$MINIMAX_API_KEY" | wrangler pages secret put MINIMAX_API_KEY --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
          echo "$ANYSEARCH_API_KEY" | wrangler pages secret put ANYSEARCH_API_KEY --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
      - name: PATCH deployment_configs plain_text
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
        run: |
          cat > /tmp/patch.py << EOF
          import json, urllib.request, os
          url = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"] + "/pages/projects/chinaconnect"
          body = json.dumps({"deployment_configs": {"production": {"env_vars": {"MINIMAX_API_KEY": {"type": "plain_text", "value": os.environ["MINIMAX_API_KEY"]}, "ANYSEARCH_API_KEY": {"type": "plain_text", "value": os.environ["ANYSEARCH_API_KEY"]}}}}}).encode()
          req = urllib.request.Request(url, data=body, method="PATCH", headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"})
          resp = urllib.request.urlopen(req)
          print("patch success:", json.loads(resp.read()).get("success"))
          EOF
          python3 /tmp/patch.py
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
      - name: Post-deploy verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > /tmp/verify.py << EOF
          import json, urllib.request, os
          url = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"] + "/pages/projects/chinaconnect"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
          resp = urllib.request.urlopen(req)
          j = json.loads(resp.read())
          for env_name in ["preview","production"]:
              cfg = j.get("result",{}).get("deployment_configs",{}).get(env_name,{})
              print(f"--- {env_name} ---")
              for k, v in (cfg.get("env_vars") or {}).items():
                  val = v.get("value","")
                  masked = (val[:8] + "..." + val[-4:]) if val else "(empty)"
                  print(f"  {k}: type={v.get('type')}, len={len(val)}, value={masked}")
          EOF
          python3 /tmp/verify.py
          echo "--- live chat ---"
          curl -sS "https://chinaengage.org/api/chat" -X POST -H "Content-Type: application/json" --data '{"model":"MiniMax-Text-01","messages":[{"role":"user","content":"hi"}]}' | head -c 500
          echo ""
          echo "--- live search ---"
          curl -sS "https://chinaengage.org/api/search" -X POST -H "Content-Type: application/json" --data '{"query":"上海","max_results":1}' | head -c 500
          echo ""
