name: Disable chinaconnect.pages.dev

on: workflow_dispatch

jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - name: Probe subdomain enable flag
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== GET current project ==="
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chinaconnect" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/proj.json
          python3 -c "import json; j=json.load(open('/tmp/proj.json')); print('subdomain:', j['result'].get('subdomain')); print('preview:', j['result'].get('preview')); print('---'); print(list(j['result'].keys()))"
          echo ""
          echo "=== Try PATCH subdomain=disabled ==="
          curl -sS -X PATCH "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chinaconnect" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"subdomain\":\"chinaconnect-disabled\"}" -o /tmp/patch.json
          python3 -c "import json; j=json.load(open('/tmp/patch.json')); print('patch success:', j.get('success')); print('errors:', j.get('errors')); print('new subdomain:', j.get('result',{}).get('subdomain'))"
