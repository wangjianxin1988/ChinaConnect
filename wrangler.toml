name = "chinaconnect"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Supabase Configuration (migrated to new project on 2026-05-27)
# SUPABASE_URL configured here
# SUPABASE_ANON_KEY configured in Cloudflare Dashboard Settings Environment Variables
# MINIMAX_API_KEY + ANYSEARCH_API_KEY are placeholder names so the wrangler
