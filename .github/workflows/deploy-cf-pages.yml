name: Debug CF secrets

on:
  push:
    branches: [master]

env:
  CLOUDFLARE_PROJECT_NAME: chinaconnect

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g wrangler@latest
      - name: Set secrets verbose
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
        run: |
          echo "MINIMAX_API_KEY length: ${#MINIMAX_API_KEY}"
          echo "ANYSEARCH_API_KEY length: ${#ANYSEARCH_API_KEY}"
          echo "--- putting MINIMAX_API_KEY ---"
          printf "%s" "$MINIMAX_API_KEY" | wrangler pages secret put MINIMAX_API_KEY --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --env production
          echo "--- putting ANYSEARCH_API_KEY ---"
          printf "%s" "$ANYSEARCH_API_KEY" | wrangler pages secret put ANYSEARCH_API_KEY --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --env production
      - name: List
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "--- list ---"
          wrangler pages secret list --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --env production
