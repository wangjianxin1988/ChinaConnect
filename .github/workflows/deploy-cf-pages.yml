name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CLOUDFLARE_PROJECT_NAME: chinaconnect

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm
      - run: pnpm install --ignore-scripts
      # IMPORTANT: do NOT use `pnpm build` here. Its prebuild hook runs
      # build-i18n-content.mjs + auto-translate scripts, which attempt ~385
      # MiniMax API calls (one per city x language). When the key is
      # unavailable/expired each call burns 3 x 25s timeouts (~8h total),
      # exceeding the job limit; when valid it rewrites curated translations.
      # All 12-language content is committed, so build directly (like local CI).
      - run: pnpm check:i18n && node node_modules/astro/astro.js build && node scripts/pack-food-details.mjs
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_MINIMAX_API_KEY: ${{ secrets.PUBLIC_MINIMAX_API_KEY }}
          PUBLIC_MINIMAX_BASE_URL: ${{ secrets.PUBLIC_MINIMAX_BASE_URL }}
          VITE_ANYSEARCH_API_KEY: ${{ secrets.VITE_ANYSEARCH_API_KEY }}
      - run: cp -r functions dist/functions
      - run: npm install -g wrangler@latest
      # Sync encrypted Pages secrets into the production environment. Without
      # --env production, wrangler 4.120 writes to the wrong environment and
      # the runtime never sees the secret. Run BEFORE deploy so the next
      # build picks them up.
      - name: Sync Pages secrets (production env)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
        run: |
          printf "%s" "$MINIMAX_API_KEY" | wrangler pages secret put MINIMAX_API_KEY --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --env production
          printf "%s" "$ANYSEARCH_API_KEY" | wrangler pages secret put ANYSEARCH_API_KEY --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --env production

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
      - name: Live probe
        run: |
          echo "--- live chat ---"
          curl -sS "https://chinaengage.org/api/chat" -X POST -H "Content-Type: application/json" --data '{"model":"MiniMax-Text-01","messages":[{"role":"user","content":"用中文说一句问候"}]}' | head -c 600
          echo ""
          echo "--- live search ---"
          curl -sS "https://chinaengage.org/api/search" -X POST -H "Content-Type: application/json" --data '{"query":"上海 旅游","max_results":1}' | head -c 600
          echo ""
