    <path d="M -20 -6 Q -10 -14 0 -6 Q 12 -14 18 -2" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.4"/>
    <circle cx="-14" cy="6" r="2" fill="#1e3a8a" opacity="0.4"/>
    <circle cx="10" cy="8" r="2" fill="#1e3a8a" opacity="0.4"/>
  </g>

  <g transform="translate(256,400)">
