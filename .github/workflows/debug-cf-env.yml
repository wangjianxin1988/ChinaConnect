name: Debug CF Pages env
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: GET project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chinaconnect" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o /tmp/proj.json
          python3 -c "
import json
j = json.load(open('/tmp/proj.json'))
print('success:', j.get('success'))
for env in ['preview','production']:
    cfg = j.get('result', {}).get('deployment_configs', {}).get(env, {})
    vars = cfg.get('env_vars', {})
    print(f'--- {env} env_vars ---')
    for k, v in vars.items():
        val = v.get('value', '')
        masked = (val[:8] + '...' + val[-4:]) if val else '(empty)'
        print(f'  {k}: type={v.get(chr(34)+"type"+chr(34))}, len={len(val)}, value={masked}')
"
