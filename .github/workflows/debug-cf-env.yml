name: Debug CF Pages env

on: workflow_dispatch

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List deployment_configs env_vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chinaconnect" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys, json; j=json.load(sys.stdin); print('success:', j.get('success')); 
for env in ['preview','production']:
    cfg=j['result']['deployment_configs'].get(env, {});
    vars=cfg.get('env_vars', {});
    print(f'\n--- {env} env_vars ---');
    [print(f'  {k}: type={v.get(\"type\")}, len={len(v.get(\"value\",\"\"))}, preview={(v.get(\"value\",\"\")[:8]+\"...\"+v.get(\"value\",\"\")[-4:]) if v.get(\"value\") else \"\"}') for k,v in vars.items()]"