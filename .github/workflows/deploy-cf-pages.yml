name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CLOUDFLARE_PROJECT_NAME: chinaconnect

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm
      - run: pnpm install --ignore-scripts
      - run: pnpm build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_MINIMAX_API_KEY: ${{ secrets.PUBLIC_MINIMAX_API_KEY }}
          PUBLIC_MINIMAX_BASE_URL: ${{ secrets.PUBLIC_MINIMAX_BASE_URL }}
          VITE_ANYSEARCH_API_KEY: ${{ secrets.VITE_ANYSEARCH_API_KEY }}
      # Copy Cloudflare Functions into dist so wrangler deploys them
      - run: cp -r functions dist/functions
      - run: npm install -g wrangler@latest
      - name: Set Pages secrets (hydrates runtime env for /api/chat and /api/search)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
        run: |
          echo "$MINIMAX_API_KEY" | wrangler pages secret put MINIMAX_API_KEY --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
          echo "$ANYSEARCH_API_KEY" | wrangler pages secret put ANYSEARCH_API_KEY --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
      - name: Patch deployment_configs env_vars (plain_text) for runtime hydration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
        run: |
          curl -sS -X PATCH "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/${{ env.CLOUDFLARE_PROJECT_NAME }}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{
              \"deployment_configs\": {
                \"production\": {
                  \"env_vars\": {
                    \"MINIMAX_API_KEY\": { \"type\": \"plain_text\", \"value\": \"$MINIMAX_API_KEY\" },
                    \"ANYSEARCH_API_KEY\": { \"type\": \"plain_text\", \"value\": \"$ANYSEARCH_API_KEY\" }
                  }
                }
              }
            }"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}