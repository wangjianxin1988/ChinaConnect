name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]

env:
  CLOUDFLARE_PROJECT_NAME: chinaconnect

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g wrangler@latest
      - name: List secrets + env_vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages secret list --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
          echo "---"
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chinaconnect" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json, sys; j=json.load(sys.stdin); cfg=j['result']['deployment_configs'].get('production',{}); print('production env_vars:', list((cfg.get('env_vars') or {}).keys()))"
